[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anki-agent"
version = "0.1.0"
description = "Local AnkiConnect JSON CLI and agent skill."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Joseph Heupler"}]
dependencies = []

[project.scripts]
anki-agent = "anki_agent.cli:run"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=7,<8"]

[tool.hatch.build.targets.wheel]
packages = ["src/anki_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
